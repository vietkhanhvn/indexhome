<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin contact</title>
  <link rel="stylesheet" href="includes/contact-admin.css">
</head>
<body>
  <div class="hm-contact-admin">
    <div class="hm-contact-admin__card">
      <div class="hm-contact-admin__header">
        <div>
          <p class="hm-contact-admin__eyebrow">Admin</p>
          <h1>Trang quản trị</h1>
          <p>Trang này cho phép bạn đổi Zalo và Facebook trực tiếp trên bản HTML tĩnh.</p>
        </div>
        <a href="index.html" class="hm-contact-admin__link">Về trang chủ</a>
      </div>

      <div id="hm-admin-status" class="hm-contact-admin__alert hm-contact-admin__alert--success" style="display:none"></div>

      <form id="hm-contact-form" class="hm-contact-admin__form">
        <label for="zalo">Zalo</label>
        <input id="zalo" class="hm-contact-admin__field" type="text" name="zalo" placeholder="0345345553" required>

        <label for="facebook">Facebook</label>
        <input id="facebook" class="hm-contact-admin__field" type="text" name="facebook" placeholder="https://www.facebook.com/..." required>

        <div class="hm-contact-admin__actions">
          <button type="submit" class="hm-contact-admin__btn">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function () {
    const storageKey = 'hm-contact-settings';
    const statusBox = document.getElementById('hm-admin-status');
    const form = document.getElementById('hm-contact-form');
    const zaloInput = document.getElementById('zalo');
    const facebookInput = document.getElementById('facebook');

    function setStatus(message, type) {
      statusBox.style.display = 'block';
      statusBox.textContent = message;
      statusBox.className = 'hm-contact-admin__alert ' + (type === 'error' ? 'hm-contact-admin__alert--error' : 'hm-contact-admin__alert--success');
    }

    function loadDefaults() {
      const fallback = { zalo: '0345345553', facebook: 'https://www.facebook.com/profile.php?id=100069526895693' };
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved) {
          const parsed = JSON.parse(saved);
          return { ...fallback, ...parsed };
        }
      } catch (e) {
        // ignore
      }
      return fallback;
    }

    const values = loadDefaults();
    zaloInput.value = values.zalo || '';
    facebookInput.value = values.facebook || '';

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const settings = {
        zalo: zaloInput.value.trim(),
        facebook: facebookInput.value.trim()
      };
      localStorage.setItem(storageKey, JSON.stringify(settings));
      setStatus('Đã lưu xong. Bạn có thể mở trang chủ để xem kết quả.', 'success');
      window.dispatchEvent(new Event('hm-contact-updated'));
    });
  })();
  </script>
</body>
</html>
