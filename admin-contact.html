<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin contact</title>
  <link rel="stylesheet" href="includes/contact-admin.css">
</head>
<body>
  <div class="hm-contact-admin">
    <div class="hm-contact-admin__card">
      <div class="hm-contact-admin__header">
        <div>
          <p class="hm-contact-admin__eyebrow">Admin</p>
          <h1>Trang quản trị</h1>
          <p>Trang này cho phép bạn đổi Zalo và Facebook trực tiếp trên bản HTML tĩnh.</p>
        </div>
        <a href="index.html" class="hm-contact-admin__link">Về trang chủ</a>
      </div>

      <div id="hm-admin-status" class="hm-contact-admin__alert hm-contact-admin__alert--success" style="display:none"></div>

      <form id="hm-contact-form" class="hm-contact-admin__form">
        <label for="zalo">Zalo</label>
        <input id="zalo" class="hm-contact-admin__field" type="text" name="zalo" placeholder="0345345553" required>

        <label for="facebook">Facebook</label>
        <input id="facebook" class="hm-contact-admin__field" type="text" name="facebook" placeholder="https://www.facebook.com/..." required>

        <label for="modalTitle">Tiêu đề modal</label>
        <input id="modalTitle" class="hm-contact-admin__field" type="text" name="modalTitle" placeholder="THÔNG BÁO">

        <label for="modalBody">Nội dung modal (dòng mới =&gt; \n)</label>
        <textarea id="modalBody" class="hm-contact-admin__field" name="modalBody" rows="4" placeholder="Nội dung hiển thị trong modal"></textarea>

        <label for="modalContactText">Văn bản liên hệ trong modal</label>
        <input id="modalContactText" class="hm-contact-admin__field" type="text" name="modalContactText" placeholder="Liên hệ ngay Zalo: 0345...">

        <label for="modalButtonLabel">Nhãn nút đóng</label>
        <input id="modalButtonLabel" class="hm-contact-admin__field" type="text" name="modalButtonLabel" placeholder="ĐÃ HIỂU, KHÔNG HIỂN THỊ LẠI">

        <label for="modalAlwaysShow">Luôn hiện modal khi tải lại?</label>
        <select id="modalAlwaysShow" name="modalAlwaysShow" class="hm-contact-admin__field">
          <option value="1">Có (mặc định)</option>
          <option value="0">Không</option>
        </select>

        <div class="hm-contact-admin__actions">
          <button type="submit" class="hm-contact-admin__btn">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function () {
    const storageKey = 'hm-contact-settings';
    const statusBox = document.getElementById('hm-admin-status');
    const form = document.getElementById('hm-contact-form');
    const zaloInput = document.getElementById('zalo');
    const facebookInput = document.getElementById('facebook');

    function setStatus(message, type) {
      statusBox.style.display = 'block';
      statusBox.textContent = message;
      statusBox.className = 'hm-contact-admin__alert ' + (type === 'error' ? 'hm-contact-admin__alert--error' : 'hm-contact-admin__alert--success');
    }

    // apply settings to form fields
    function applyValues(values) {
      const v = values || {};
      zaloInput.value = v.zalo || '';
      facebookInput.value = v.facebook || '';

      var modalTitleEl = document.getElementById('modalTitle');
      var modalBodyEl = document.getElementById('modalBody');
      var modalContactTextEl = document.getElementById('modalContactText');
      var modalButtonLabelEl = document.getElementById('modalButtonLabel');
      var modalAlwaysShowEl = document.getElementById('modalAlwaysShow');

      if (modalTitleEl) modalTitleEl.value = v.modalTitle || '';
      if (modalBodyEl) modalBodyEl.value = v.modalBody || '';
      if (modalContactTextEl) modalContactTextEl.value = v.modalContactText || '';
      if (modalButtonLabelEl) modalButtonLabelEl.value = v.modalButtonLabel || '';
      if (modalAlwaysShowEl) modalAlwaysShowEl.value = v.modalAlwaysShow ? '1' : '0';
    }

    // Try fetch settings from server first, fallback to localStorage, then defaults
    (function loadSettings() {
      const fallback = { zalo: '0345345553', facebook: 'https://www.facebook.com/profile.php?id=100069526895693', modalTitle: '', modalBody: '', modalContactText: '', modalButtonLabel: '', modalAlwaysShow: true };
      fetch('./data/contact-settings.json', { cache: 'no-store' }).then(function (res) {
        if (!res.ok) throw new Error('no-settings');
        return res.json();
      }).then(function (json) {
        applyValues(Object.assign({}, fallback, json));
      }).catch(function () {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved) {
            const parsed = JSON.parse(saved);
            applyValues(Object.assign({}, fallback, parsed));
            return;
          }
        } catch (e) {
          // ignore
        }
        applyValues(fallback);
      });
    })();

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const settings = {
        zalo: zaloInput.value.trim(),
        facebook: facebookInput.value.trim()
      };
      // Save to server JSON so frontend pages can read from /data/contact-settings.json
      const formData = new FormData();
      formData.append('zalo', settings.zalo);
      formData.append('facebook', settings.facebook);
      // modal fields
      formData.append('modalTitle', modalTitleEl ? modalTitleEl.value.trim() : '');
      formData.append('modalBody', modalBodyEl ? modalBodyEl.value.trim() : '');
      formData.append('modalContactText', modalContactTextEl ? modalContactTextEl.value.trim() : '');
      formData.append('modalButtonLabel', modalButtonLabelEl ? modalButtonLabelEl.value.trim() : '');
      formData.append('modalAlwaysShow', modalAlwaysShowEl ? (modalAlwaysShowEl.value === '1' ? '1' : '0') : '1');

      fetch('save-contact.php', {
        method: 'POST',
        body: formData
      }).then(res => res.json()).then(data => {
        if (data && data.success) {
          // keep a local copy for instant preview
          localStorage.setItem(storageKey, JSON.stringify(settings));
          setStatus('Đã lưu xong. Bạn có thể mở trang chủ để xem kết quả.', 'success');
          window.dispatchEvent(new Event('hm-contact-updated'));
        } else {
          setStatus('Lưu thất bại: ' + (data.message || 'Lỗi máy chủ'), 'error');
        }
      }).catch(err => {
        setStatus('Lưu thất bại: ' + err.message, 'error');
      });
    });
  })();
  </script>
</body>
</html>
