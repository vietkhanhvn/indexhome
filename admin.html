<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý liên hệ</title>
  <link rel="stylesheet" href="includes/contact-admin.css">
</head>
<body>
  <div class="hm-contact-admin">
    <div class="hm-contact-admin__card">
      <div class="hm-contact-admin__header">
        <div>
          <p class="hm-contact-admin__eyebrow">Admin</p>
          <h1>Quản lý liên hệ</h1>
          <p>Điền Zalo và link Facebook rồi bấm lưu. Giá trị này sẽ được dùng cho toàn bộ trang tĩnh.</p>
        </div>
        <a href="index.html" class="hm-contact-admin__link">Về trang chủ</a>
      </div>

      <div id="hm-admin-status" class="hm-contact-admin__alert hm-contact-admin__alert--success" style="display:none"></div>

      <form id="hm-contact-form" class="hm-contact-admin__form">
        <label for="zalo">Zalo</label>
        <input id="zalo" class="hm-contact-admin__field" type="text" name="zalo" placeholder="0345345553" required>

        <label for="facebook">Facebook</label>
        <input id="facebook" class="hm-contact-admin__field" type="text" name="facebook" placeholder="https://www.facebook.com/..." required>

        <hr>
        <h3>Nội dung Modal thông báo</h3>
        <label for="modalTitle">Tiêu đề</label>
        <input id="modalTitle" class="hm-contact-admin__field" type="text" name="modalTitle" placeholder="THÔNG BÁO">

        <label for="modalBody">Nội dung (dòng mới = \n)</label>
        <textarea id="modalBody" class="hm-contact-admin__field" name="modalBody" rows="5" placeholder="Nội dung hiển thị trong modal"></textarea>

        <label for="modalContactText">Văn bản liên hệ</label>
        <input id="modalContactText" class="hm-contact-admin__field" type="text" name="modalContactText" placeholder="Liên hệ ngay Zalo: 0345...">

        <label for="modalButtonLabel">Nhãn nút đóng</label>
        <input id="modalButtonLabel" class="hm-contact-admin__field" type="text" name="modalButtonLabel" placeholder="ĐÃ HIỂU, KHÔNG HIỂN THỊ LẠI">

        <label for="modalAlwaysShow">Luôn hiện modal khi tải lại?</label>
        <select id="modalAlwaysShow" name="modalAlwaysShow" class="hm-contact-admin__field">
          <option value="1">Có</option>
          <option value="0">Không</option>
        </select>

        <div class="hm-contact-admin__actions">
          <button type="submit" class="hm-contact-admin__btn">Lưu thay đổi</button>
          <a href="/" class="hm-contact-admin__link">Xem trang chủ</a>
        </div>
      </form>

      <p class="hm-contact-admin__hint">Lưu ý: dữ liệu này được lưu trong trình duyệt hiện tại. Nếu bạn mở website trên thiết bị khác, hãy chỉnh lại trên thiết bị đó.</p>
    </div>
  </div>

  <script>
  (function () {
    const storageKey = 'hm-contact-settings';
    const statusBox = document.getElementById('hm-admin-status');
    const form = document.getElementById('hm-contact-form');
    const zaloInput = document.getElementById('zalo');
    const facebookInput = document.getElementById('facebook');

    function setStatus(message, type) {
      statusBox.style.display = 'block';
      statusBox.textContent = message;
      statusBox.className = 'hm-contact-admin__alert ' + (type === 'error' ? 'hm-contact-admin__alert--error' : 'hm-contact-admin__alert--success');
    }

    function loadDefaults() {
      const fallback = {
        zalo: '0345345553',
        facebook: 'https://www.facebook.com/profile.php?id=100069526895693',
        modalTitle: 'THÔNG BÁO',
        modalBody: '',
        modalContactText: '',
        modalButtonLabel: 'ĐÃ HIỂU, KHÔNG HIỂN THỊ LẠI',
        modalAlwaysShow: true
      };

      try {
        const saved = localStorage.getItem(storageKey);
        if (saved) {
          const parsed = JSON.parse(saved);
          return Object.assign({}, fallback, parsed);
        }
      } catch (e) {
        // ignore and use fallback
      }

      return fallback;
    }

    function populate() {
      const values = loadDefaults();
      zaloInput.value = values.zalo || '';
      facebookInput.value = values.facebook || '';
      // modal fields (if present on page)
      var modalTitleEl = document.getElementById('modalTitle');
      var modalBodyEl = document.getElementById('modalBody');
      var modalContactTextEl = document.getElementById('modalContactText');
      var modalButtonLabelEl = document.getElementById('modalButtonLabel');
      var modalAlwaysShowEl = document.getElementById('modalAlwaysShow');
      if (modalTitleEl) modalTitleEl.value = values.modalTitle || '';
      if (modalBodyEl) modalBodyEl.value = values.modalBody || '';
      if (modalContactTextEl) modalContactTextEl.value = values.modalContactText || '';
      if (modalButtonLabelEl) modalButtonLabelEl.value = values.modalButtonLabel || '';
      if (modalAlwaysShowEl) modalAlwaysShowEl.value = values.modalAlwaysShow ? '1' : '0';
    }

    populate();

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const settings = {
        zalo: zaloInput.value.trim(),
        facebook: facebookInput.value.trim(),
        modalTitle: (document.getElementById('modalTitle') && document.getElementById('modalTitle').value) ? document.getElementById('modalTitle').value.trim() : '',
        modalBody: (document.getElementById('modalBody') && document.getElementById('modalBody').value) ? document.getElementById('modalBody').value.trim() : '',
        modalContactText: (document.getElementById('modalContactText') && document.getElementById('modalContactText').value) ? document.getElementById('modalContactText').value.trim() : '',
        modalButtonLabel: (document.getElementById('modalButtonLabel') && document.getElementById('modalButtonLabel').value) ? document.getElementById('modalButtonLabel').value.trim() : '',
        modalAlwaysShow: (document.getElementById('modalAlwaysShow') && document.getElementById('modalAlwaysShow').value === '1')
      };

      localStorage.setItem(storageKey, JSON.stringify(settings));
      setStatus('Đã lưu thành công. Thông báo modal sẽ cập nhật khi tải lại trang.', 'success');
      window.dispatchEvent(new Event('hm-contact-updated'));
    });
  })();
  </script>
</body>
</html>
